name: Seam Guard
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@3fee6763234110473bd57dd4595c5199fce2c510 # v1.258.0
        with:
          ruby-version: "3.4"
      - name: Validate the proposed revision with the base-trusted guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$BASE_SHA:$HEAD_SHA:$PR_NUMBER" in
            *[!0-9a-f:]*|*::*|:*|*:) exit 1 ;;
          esac
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$HEAD_SHA"
          .agents/bin/seam-guard "$BASE_SHA" "$HEAD_SHA"
