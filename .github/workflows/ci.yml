name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - batches/**
      - claims/**
      - events/**
      - heartbeats/**

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@3fee6763234110473bd57dd4595c5199fce2c510 # v1.258.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@3fee6763234110473bd57dd4595c5199fce2c510 # v1.258.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        run: |
          for test_file in test/*_test.rb; do
            case "$test_file" in
              test/http_backend_integration_test.rb) continue ;;
            esac
            bundle exec ruby -Itest "$test_file"
          done
          bundle exec ruby sim/test/scripted_worker_test.rb
          bundle exec ruby sim/test/race_test.rb
          bundle exec ruby sim/test/verify_batch_test.rb
          bundle exec ruby sim/test/llm_worker_test.rb

  test-ruby-floor:
    name: Test (Ruby 3.2 floor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@3fee6763234110473bd57dd4595c5199fce2c510 # v1.258.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run tests
        run: |
          for test_file in test/*_test.rb; do
            case "$test_file" in
              test/http_backend_integration_test.rb) continue ;;
            esac
            bundle exec ruby -Itest "$test_file"
          done
          bundle exec ruby sim/test/scripted_worker_test.rb
          bundle exec ruby sim/test/race_test.rb
          bundle exec ruby sim/test/verify_batch_test.rb
          bundle exec ruby sim/test/llm_worker_test.rb

  worker-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Typecheck Worker
        run: npm run typecheck
        working-directory: worker

  worker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Run Worker smoke
        working-directory: worker
        run: |
          discover_wrangler_url() {
            # shellcheck disable=SC2016
            node -e '
              const fs = require("node:fs");
              const log = fs.readFileSync(process.argv[1], "utf8");
              const pattern = /Ready on http:\/\/(?:localhost|127\.0\.0\.1):([0-9]{1,5})(?:\/|\s|$)/g;
              let url;
              for (const match of log.matchAll(pattern)) {
                const port = Number(match[1]);
                if (port >= 1 && port <= 65_535) url = `http://127.0.0.1:${port}`;
              }
              if (url) process.stdout.write(url);
              else process.exit(1);
            ' /tmp/wrangler.log
          }
          DYNAMIC_HTTP_PORT=1
          WRANGLER_PORT="${AGENT_COORD_TEST_HTTP_PORT:-0}"
          AGENT_COORD_API_URL=""
          if [ -n "${AGENT_COORD_TEST_HTTP_PORT:-}" ] && [ "${AGENT_COORD_TEST_HTTP_PORT:-}" != "0" ]; then
            DYNAMIC_HTTP_PORT=0
            AGENT_COORD_API_URL="http://127.0.0.1:${AGENT_COORD_TEST_HTTP_PORT}"
          fi
          npx wrangler d1 migrations apply agent-coord --local
          npx wrangler d1 execute agent-coord --local --command "INSERT OR REPLACE INTO machines (machine, token_hash, created_at, revoked_at) VALUES ('dev', '9428e07c68054de014032f21e0716501aa937714fd31033caf589e66b276e53b', datetime('now'), NULL)"
          npx wrangler dev --local --port "$WRANGLER_PORT" > /tmp/wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            kill -0 "$worker_pid" 2>/dev/null || { cat /tmp/wrangler.log; exit 1; }
            if [ "$DYNAMIC_HTTP_PORT" -eq 1 ]; then
              AGENT_COORD_API_URL="$(discover_wrangler_url 2>/dev/null || true)"
            fi
            if [ -n "$AGENT_COORD_API_URL" ] && curl -fsS "$AGENT_COORD_API_URL/v1/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          [ -n "$AGENT_COORD_API_URL" ] || { echo "wrangler dev never reported a valid ready address"; cat /tmp/wrangler.log; exit 1; }
          curl -fsS "$AGENT_COORD_API_URL/v1/health" >/dev/null || { cat /tmp/wrangler.log; exit 1; }
          export AGENT_COORD_API_URL
          ./bin/smoke || { cat /tmp/wrangler.log; exit 1; }

  worker-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@3fee6763234110473bd57dd4595c5199fce2c510 # v1.258.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Run HTTP backend integration suite
        run: bin/test-http-integration
